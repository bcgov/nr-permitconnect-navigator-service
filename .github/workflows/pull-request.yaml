name: Pull Request

on:
  pull_request:
    branches:
      - master
      - "feature/**"
      - "release/**"
    types:
      - closed
      - labeled
      - opened
      - reopened
      - synchronize
      - unlabeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push
    if: github.event.pull_request.state == 'open' && !github.event.pull_request.head.repo.fork && contains(github.event.pull_request.labels.*.name, 'deploy')
    uses: ./.github/workflows/builder.yaml
    permissions:
      contents: read
      packages: write
    with:
      context: .
      image_name: ${{ vars.APP_NAME }}
      github_username: ${{ github.repository_owner }}
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  deploy-pr:
    name: Deploy Instance
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/deployer.yaml
    with:
      app_name: ${{ vars.APP_NAME }}
      acronym: ${{ vars.ACRONYM }}
      environment: pr
      image_tag: ${{ needs.build.outputs.image_tag }}
      job_name: pr-${{ github.event.number }}
      namespace_prefix: ${{ vars.NAMESPACE_PREFIX }}
      namespace_environment: dev
      database_name: pr-${{ github.event.number }}
    secrets:
      openshift_server: ${{ secrets.OPENSHIFT_SERVER }}
      openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}

  seed-db:
    name: Seed database
    needs: deploy-pr
    environment:
      name: pr
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to OpenShift Cluster
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_server: ${{ secrets.OPENSHIFT_SERVER }}
          oc_token: ${{ secrets.OPENSHIFT_TOKEN }}
          oc_namespace: ${{ vars.NAMESPACE_PREFIX }}-dev

      - name: Run database seeds
        shell: bash
        run: |
          kubectl exec $(oc get pods --selector='app.kubernetes.io/instance=pr-${{ github.event.number }},app.kubernetes.io/name=nr-permitconnect-navigator-service' -o custom-columns=POD:.metadata.name --no-headers | head -1) -- \
            /usr/local/bin/node \
            --conditions=sbin \
            ./node_modules/knex/bin/cli.js \
            seed:run \
            --specific=dev_groups.js \
            --knexfile=./sbin/knexfile.js

  comment-pr:
    name: Comment on PR
    needs:
      - deploy-pr
      - seed-db
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Release Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: success()
        with:
          header: release
          message: |
            Release ${{ github.sha }} deployed at <https://${{ vars.ACRONYM }}-dev-pr-${{ github.event.number }}.apps.silver.devops.gov.bc.ca>

  destroy:
    name: Destroy Instance
    if: >
      !github.event.pull_request.head.repo.fork &&
      (
        (
          github.event.pull_request.state == 'closed' &&
          contains(github.event.pull_request.labels.*.name, 'deploy')
        ) ||
        (
          github.event.action == 'unlabeled' &&
          github.event.label.name == 'deploy'
        )
      )
    environment:
      name: pr
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to OpenShift Cluster
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_server: ${{ secrets.OPENSHIFT_SERVER }}
          oc_token: ${{ secrets.OPENSHIFT_TOKEN }}
          oc_namespace: ${{ vars.NAMESPACE_PREFIX }}-dev

      - name: Remove PR Deployment
        shell: bash
        run: |
          NS="${{ vars.NAMESPACE_PREFIX }}-dev"
          RELEASE="pr-${{ github.event.number }}"

          if helm status "$RELEASE" --namespace "$NS" >/dev/null 2>&1; then
            helm uninstall --namespace "$NS" "$RELEASE" --timeout 10m --wait
          fi

          oc delete --namespace "$NS" cm,secret \
            --selector app.kubernetes.io/instance="$RELEASE" \
            --ignore-not-found=true

      - name: Drop PR Database
        if: always()
        shell: bash
        run: |
          NS="${{ vars.NAMESPACE_PREFIX }}-dev"
          DB="pr-${{ github.event.number }}"
          POD=$(oc get pod -n "$NS" -o name --no-headers \
            -l postgres-operator.crunchydata.com/cluster=crunchy,postgres-operator.crunchydata.com/role=master | head -1)

          if [ -z "$POD" ]; then
            echo "::warning::No crunchy primary found in $NS; leaving database $DB in place."
            exit 0
          fi

          oc exec -n "$NS" "$POD" -c database -- \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS \"${DB}\" WITH (FORCE);"

      - name: Remove Release Comment on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: release
          delete: true

      - name: Remove Github Deployment Environment
        if: always()
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476 # v4.0.0
        with:
          environment: pr
          onlyRemoveDeployments: true
          token: ${{ secrets.GITHUB_TOKEN }}
