openapi: 3.0.4
info:
  version: 1.0.0
  title: NR PermitConnect Navigator Service (PCNS)
  description: >-
    A case management application meant to serve the needs of the NRM Permitting
    Solutions Branch.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
    description: This server
security:
  - BearerAuth: []
    OpenID: []
tags:
