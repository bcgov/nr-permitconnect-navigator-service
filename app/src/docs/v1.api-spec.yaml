                firstName:
                  type: string
                  maxLength: 255
                fullName:
                  type: string
                  maxLength: 255
                lastName:
                  type: string
                  maxLength: 255
                active:
                  type: boolean
                group:
                  type: array
                  items:
                    type: string
                    maxLength: 255
                includeUserGroups:
                  type: boolean
                initiative:
                  type: array
                  items:
                    type: string
                    maxLength: 255
