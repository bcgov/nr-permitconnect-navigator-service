            - userId
            - firstName
            - lastName
            - phoneNumber
            - email
            - contactPreference
            - contactApplicantRelationship
            - createdBy
            - createdAt
            - updatedBy
            - updatedAt
            - deletedBy
            - deletedAt
          additionalProperties: false
