{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-ingress-to-{{ include "pcns.fullname" . }}-app
  labels:
    {{- include "pcns.labels" . | nindent 4 }}
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: {{ default "8080" .Values.config.configMap.SERVER_PORT | atoi }}
          protocol: TCP
  podSelector:
    matchLabels: {{- include "pcns.selectorLabels" . | nindent 6 }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ include "pcns.fullname" . }}-app-to-{{ .Values.database.name }}-cluster
  labels:
    {{- include "pcns.labels" . | nindent 4 }}
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels: {{ include "pcns.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ default "5432" .Values.config.configMap.SERVER_DB_PORT | atoi }}
          protocol: TCP
  podSelector:
    matchLabels:
      {{- include "pcns.database.selectorLabels" .  | nindent 6 }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migration-job-to-{{ .Values.database.name }}
  labels:
    {{- include "pcns.labels" . | nindent 4 }}
spec:
  ingress:
    - from:
        - podSelector:
            # TODO: Targets the explicit labels we will define in your migration-job.yaml
            matchLabels:
              app.kubernetes.io/component: database-migration
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ default "5432" .Values.config.configMap.SERVER_DB_PORT | atoi }}
          protocol: TCP
  podSelector:
    matchLabels:
      {{- include "pcns.database.selectorLabels" .  | nindent 6 }}

{{- if .Values.peachSync.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ include "pcns.fullname" . }}-peach-sync-app-to-{{ .Values.database.name }}-cluster
  labels:
    {{- include "pcns.labels" . | nindent 4 }}
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels: {{ include "pcns.peachSyncSelectorLabels" . | nindent 14 }}
      ports:
        - port: {{ default "5432" .Values.config.configMap.SERVER_DB_PORT | atoi }}
          protocol: TCP
  podSelector:
    matchLabels:
      {{- include "pcns.database.selectorLabels" .  | nindent 6 }}
{{- end }}

{{- end }}
